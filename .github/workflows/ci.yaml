name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: swift format lint --recursive --strict --parallel .

  # Linux, Windows, and Android, using the Swift project's shared workflow.
  cross-platform:
    name: Cross-platform
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      linux_swift_versions: '["6.0", "6.1", "6.2", "6.3", "6.4"]'
      windows_swift_versions: '["6.0", "6.1", "6.2", "6.3", "6.4"]'
      enable_android_sdk_build: true
      android_sdk_versions: '["6.4"]'

  macos:
    name: macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  thread-sanitizer:
    name: Thread sanitizer
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test with the thread sanitizer
        run: swift test --sanitize=thread
