name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: swift format lint --recursive --strict --parallel .

  # Linux, Windows, and Android, using the Swift project's shared workflow.
  cross-platform:
    name: Cross-platform
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      linux_swift_versions: '["6.0", "6.1", "6.2", "6.3", "6.4"]'
      windows_swift_versions: '["6.0", "6.1", "6.2", "6.3", "6.4"]'
      enable_android_sdk_build: true
      android_sdk_versions: '["6.4"]'

  macos:
    name: macOS (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build

  ios:
    name: Build & Test (iOS Simulator)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          xcodebuild test \
            -scheme cow-swift \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'

  thread-sanitizer:
    name: Thread sanitizer
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      - name: Test with the thread sanitizer
        run: swift test --sanitize=thread

  # A single required status check for branch protection, so the matrix can change without
  # the ruleset needing to.
  all-checks:
    name: All checks passed
    if: always()
    needs: [lint, cross-platform, macos, ios, thread-sanitizer]
    runs-on: ubuntu-latest
    steps:
      - name: Verify that every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
